name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        run: uv run pytest -q

      - name: Mock eval smoke run and report
        run: |
          uv run compaction-eval --mock --tasks 3 --seeds 1 --out results/ --run-name ci
          uv run compaction-report --run results/runs/ci
