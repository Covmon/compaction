[project]
name = "compaction"
version = "0.1.0"
description = "Compares Indexed Retention (a retrieval index for agent context) against summary compaction and truncation under a small context cap."
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9.0",
    "matplotlib>=3.11.2",
    "openai>=2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
compaction-eval = "compaction.eval.runner:main"
compaction-report = "compaction.eval.report:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
